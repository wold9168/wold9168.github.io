---
layout: post
title: categories
---

{% for category in site.categories %}
  <h3><a href="/{{ category[0] }}">{{ category[0] }}</a></h3>
  <ul>
    {% for post in category[1] %}
      <li>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
      </li>
    {% endfor %}
  </ul>
{% endfor %}
